<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UHTML</title>
<style>
:root{
  --bg:#f2f2f2;--panel:#fff;--line:#c8c8c8;--text:#181818;
  --muted:#666;--hover:#e9e9e9;--active:#ddd;--accent:#1a1a1a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden
}
button,input{font:inherit}
.app{height:100vh;display:flex;flex-direction:column}
.topbar{
  height:48px;background:#fafafa;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 10px;gap:7px
}
.title{font-size:16px;font-weight:700;margin-right:auto;padding-left:5px}
.topbtn{
  border:1px solid #aaa;background:#fff;padding:7px 13px;
  border-radius:2px;cursor:pointer
}
.topbtn:hover{background:var(--hover)}
.topbtn:active{background:var(--active)}
.workspace{min-height:0;flex:1;display:flex}
.sidebar{
  width:230px;min-width:230px;background:#ededed;
  border-right:1px solid var(--line);display:flex;flex-direction:column
}
.side-head{
  height:39px;padding:11px 12px 8px;font-size:12px;
  color:#555;border-bottom:1px solid var(--line);font-weight:700
}
.files{overflow:auto;padding:6px}
.file{
  display:flex;align-items:center;gap:8px;padding:8px 9px;
  margin-bottom:2px;border-radius:2px;cursor:pointer;font:13px Consolas,monospace
}
.file:hover{background:#e3e3e3}
.file.active{background:#d8d8d8}
.file-icon{width:18px;text-align:center;font-family:Arial;font-size:11px}
.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor-wrap{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}
.tabs{
  height:39px;background:#f5f5f5;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;overflow:auto
}
.tab{
  height:38px;border-right:1px solid var(--line);padding:10px 14px;
  min-width:100px;cursor:pointer;font:12px Consolas,monospace;
  background:#ebebeb;position:relative
}
.tab.active{background:#fff}
.tab .x{
  margin-left:8px;color:#777;cursor:pointer
}
.editor{
  min-height:0;flex:1;display:flex;background:#fff
}
textarea{
  width:100%;height:100%;border:0;outline:0;resize:none;
  padding:16px 18px;font:14px/1.55 Consolas,"Liberation Mono",monospace;
  color:#111;background:#fff;tab-size:2
}
textarea.readonly{background:#f5f5f5;color:#666}
.statusbar{
  height:27px;border-top:1px solid var(--line);background:#f4f4f4;
  display:flex;align-items:center;padding:0 10px;color:#555;
  font:11px Consolas,monospace
}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.25);
  display:none;align-items:center;justify-content:center
}
.modal{
  width:360px;background:#fff;border:1px solid #999;box-shadow:0 5px 25px rgba(0,0,0,.2)
}
.modal-head{padding:12px;border-bottom:1px solid var(--line);font-weight:700}
.modal-body{padding:13px}
.modal-body button{
  display:block;width:100%;margin:7px 0;text-align:left;padding:10px 12px;
  border:1px solid #aaa;background:#fafafa;cursor:pointer
}
.modal-body button:hover{background:#eee}
.modal-foot{padding:10px 13px;border-top:1px solid var(--line);text-align:right}
input.shareurl{
  width:100%;padding:9px;border:1px solid #aaa;font:12px Consolas,monospace
}
.hidden{display:none!important}
@media(max-width:850px){
  .sidebar{width:190px;min-width:190px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">UHTML</div>
    <button class="topbtn" id="shareBtn">Share</button>
    <button class="topbtn" id="addFileBtn">파일 추가</button>
  </div>

  <div class="workspace">
    <aside class="sidebar">
      <div class="side-head">FILES</div>
      <div id="files" class="files"></div>
      <div style="padding:8px;border-top:1px solid var(--line);font-size:11px;color:#666">
        <div>Double-click a file to rename</div>
        <div>Right-click a file to remove</div>
      </div>
    </aside>

    <section class="editor-wrap">
      <div id="tabs" class="tabs"></div>
      <div class="editor">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div class="statusbar">
        <span id="status">UHTML-LZ · Ready</span>
        <span id="stats" style="margin-left:auto"></span>
      </div>
    </section>
  </div>
</div>

<div id="addModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">파일 추가</div>
    <div class="modal-body">
      <button data-type="html">HTML 파일</button>
      <button data-type="css">CSS 파일</button>
      <button data-type="js">JavaScript 파일</button>
    </div>
    <div class="modal-foot"><button class="topbtn" id="closeAdd">취소</button></div>
  </div>
</div>

<div id="shareModal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">UHTML Share</div>
    <div class="modal-body">
      <input id="shareUrl" class="shareurl" readonly>
      <div style="margin-top:9px;color:#666;font-size:12px">wt=wa는 수정 가능, wt=no는 읽기 전용입니다.</div>
    </div>
    <div class="modal-foot">
      <button class="topbtn" id="copyShare">복사</button>
      <button class="topbtn" id="closeShare">닫기</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------------- UHTML-LZ v2 ---------------- */

const MAGIC = [0x55,0x48,0x54,0x4d,0x4c,0x02]; // UHTML-LZ v2
const OLD_MAGIC = [0x55,0x48,0x54,0x4d,0x4c,0x01];
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

// Static web dictionary. IDs are compact and are encoded before LZ.
const TOKENS = [
  "<html","</html>","<head","</head>","<body","</body>","<title","</title>",
  "<meta","<link","<style>","</style>","<scr"+"ipt>","</scr"+"ipt>","<div","</div>",
  "<span","</span>","<p","</p>","<h1","</h1>","<h2","</h2>","<h3","</h3>",
  "<button","</button>","<a","</a>","<img","<input","<form","</form>",
  "class","id","style","src","href","type","name","value","placeholder","onclick",
  "document","window","console","function","return","const","let","var","new",
  "true","false","null","undefined","this","addEventListener","removeEventListener",
  "getElementById","querySelector","querySelectorAll","createElement","appendChild",
  "display","position","absolute","relative","fixed","sticky","flex","grid","block","inline",
  "width","height","min-width","max-width","min-height","max-height","margin","padding",
  "top","right","bottom","left","gap","align-items","justify-content","flex-direction",
  "font","font-size","font-weight","font-family","line-height","text-align","text-decoration",
  "color","background","background-color","border","border-radius","box-shadow","opacity",
  "overflow","cursor","transition","transform","content","z-index","white-space","outline",
  "JSON","Math","Array","Object","String","Number","Date","Promise","setTimeout","setInterval",
  "https://","http://",".com",".org",".net","github","pages","script","stylesheet"
];
const tokenMap=new Map(TOKENS.map((x,i)=>[x,i]));

function u8(s){return new TextEncoder().encode(s)}
function text(b){return new TextDecoder().decode(b)}
function varint(n){const a=[];while(n>=128){a.push((n&127)|128);n=Math.floor(n/128)}a.push(n);return a}
function readVar(a,p){let n=0,sh=0;while(p.i<a.length){const x=a[p.i++];n+=(x&127)*2**sh;if(!(x&128))return n;sh+=7}throw Error("bad varint")}

// Conservative source minifier. Strings/templates are never modified.
function compactSource(src,type){
  let out="",i=0,quote=null,space=false;
  const isWord=c=>/[A-Za-z0-9_$]/.test(c);
  while(i<src.length){
    const c=src[i],n=src[i+1]||"";
    if(quote){
      out+=c;
      if(c==='\\' && i+1<src.length){out+=src[++i]}
      else if(c===quote)quote=null;
      i++; continue;
    }
    if(c==='"'||c==="'"||c==='`'){if(space){out+=' ';space=false}quote=c;out+=c;i++;continue}
    if(type!=='html' && c==='/' && n==='*'){
      i+=2;while(i<src.length && !(src[i]==='*'&&src[i+1]==='/'))i++;i+=2;space=true;continue
    }
    if(type==='js' && c==='/' && n==='/'){
      i+=2;while(i<src.length&&src[i]!=='\n')i++;space=true;continue
    }
    if(/\s/.test(c)){space=true;i++;continue}
    if(space){
      const prev=out[out.length-1]||"";
      if(prev && isWord(prev) && isWord(c))out+=' ';
      space=false;
    }
    out+=c;i++;
  }
  return out;
}

// Tokenize into a compact tagged stream. Literal runs stay byte-packed.
function webTokenEncode(src,type){
  const s=compactSource(src,type),out=[];let i=0,literal=[];
  const flush=()=>{if(!literal.length)return;while(literal.length){const n=Math.min(255,literal.length);out.push(0x00,n,...literal.splice(0,n))}};
  while(i<s.length){
    let best=-1,bestLen=0;
    for(let id=0;id<TOKENS.length;id++){
      const t=TOKENS[id];if(t.length>bestLen&&s.startsWith(t,i)){best=id;bestLen=t.length}
    }
    if(best>=0){flush();out.push(0x80|(best&0x7f));i+=bestLen;continue}
    const cp=s.codePointAt(i),ch=String.fromCodePoint(cp);
    const b=u8(ch);literal.push(...b);i+=ch.length;
  }
  flush();return Uint8Array.from(out)
}
function webTokenDecode(a){
  const out=[];let p=0;
  while(p<a.length){
    const op=a[p++];
    if(op<0x80){const n=a[p++];for(let i=0;i<n;i++)out.push(a[p++])}
    else {const id=op&0x7f;if(id>=TOKENS.length)throw Error("bad token");out.push(...u8(TOKENS[id]))}
  }
  return Uint8Array.from(out)
}

// High-quality LZ encoder: 64 KiB window, hash chains, longest match search.
function lz2Compress(a){
  const n=a.length,head=new Int32Array(65536),prev=new Int32Array(n);head.fill(-1);prev.fill(-1);
  const out=[],literal=[];let i=0;
  const flush=()=>{let p=0;while(p<literal.length){const len=Math.min(255,literal.length-p);out.push(0x00,len,...literal.slice(p,p+len));p+=len}literal.length=0};
  const hashAt=pos=>((a[pos]*251+a[pos+1]*31+a[pos+2]*7+a[pos+3])&65535);
  while(i<n){
    let bestLen=0,bestDist=0;
    if(i+3<n){
      const h=hashAt(i);let j=head[h],depth=0;
      while(j>=0 && i-j<=65535 && depth<96){
        let k=0,max=Math.min(255,n-i);
        while(k<max && a[j+k]===a[i+k])k++;
        if(k>=4 && k>bestLen){bestLen=k;bestDist=i-j;if(k>=96)break}
        j=prev[j];depth++;
      }
      prev[i]=head[h];head[h]=i;
    }
    // RLE for a repeated byte; useful for CSS spaces, zeros, separators, etc.
    let r=1;if(i+1<n){while(i+r<n&&a[i+r]===a[i]&&r<255)r++}
    if(r>=4 && r>bestLen){
      flush();out.push(0x40,r,a[i]);i+=r;continue
    }
    if(bestLen>=4){
      flush();out.push(0x80,bestLen,...varint(bestDist));
      for(let k=1;k<bestLen;k++){
        const pos=i+k;if(pos+3<n){const h=hashAt(pos);prev[pos]=head[h];head[h]=pos}
      }
      i+=bestLen;continue
    }
    literal.push(a[i]);i++;
  }
  flush();return Uint8Array.from(out)
}
function lz2Decompress(a){
  const out=[];let p=0;
  while(p<a.length){
    const op=a[p++];
    if(op===0){const n=a[p++];for(let i=0;i<n;i++)out.push(a[p++])}
    else if(op===0x40){const n=a[p++],v=a[p++];for(let i=0;i<n;i++)out.push(v)}
    else if(op===0x80){const len=a[p++];let q={i:p};const dist=readVar(a,q);p=q.i;if(dist<=0||dist>out.length)throw Error("bad distance");for(let i=0;i<len;i++)out.push(out[out.length-dist])}
    else throw Error("bad LZ2 opcode")
  }
  return Uint8Array.from(out)
}

// Canonical Huffman. Code lengths are serialized with a tiny RLE table.
function huffCompress(data){
  if(data.length<96)return null;
  const freq=new Uint32Array(256);for(const b of data)freq[b]++;
  const nodes=[];for(let i=0;i<256;i++)if(freq[i])nodes.push({sym:i,f:freq[i],l:null,r:null});
  if(nodes.length<=1)return null;
  let pool=nodes.slice();
  while(pool.length>1){
    pool.sort((a,b)=>a.f-b.f||a.sym-b.sym);
    const a=pool.shift(),b=pool.shift();
    pool.push({sym:-1,f:a.f+b.f,l:a,r:b});
  }
  const lens=new Uint8Array(256);
  (function walk(n,d){
    if(n.sym>=0){lens[n.sym]=Math.max(1,d);return}
    walk(n.l,d+1);walk(n.r,d+1);
  })(pool[0],0);

  const syms=[];for(let i=0;i<256;i++)if(lens[i])syms.push(i);
  syms.sort((a,b)=>lens[a]-lens[b]||a-b);
  const codes=new Array(256).fill(0n);
  let code=0n,prevLen=0;
  for(const sym of syms){
    const len=lens[sym];
    code <<= BigInt(len-prevLen);
    codes[sym]=code;
    code++;
    prevLen=len;
  }

  const bits=[];let acc=0,nb=0;
  for(const b of data){
    const len=lens[b],c=codes[b];
    for(let k=len-1;k>=0;k--){
      acc=(acc<<1)|Number((c>>BigInt(k))&1n);nb++;
      if(nb===8){bits.push(acc);acc=0;nb=0}
    }
  }
  if(nb)bits.push(acc<<(8-nb));
  // 4-byte original length + 256 code lengths + bitstream.
  const head=[data.length&255,(data.length>>>8)&255,(data.length>>>16)&255,(data.length>>>24)&255,...lens];
  return Uint8Array.from([...head,...bits]);
}
function huffDecompress(data){
  if(data.length<260)throw Error("invalid Huffman stream");
  let p=0;
  const orig=(data[p++]|(data[p++]<<8)|(data[p++]<<16)|(data[p++]<<24))>>>0;
  const lens=data.slice(p,p+256);p+=256;
  const syms=[];for(let i=0;i<256;i++)if(lens[i])syms.push(i);
  syms.sort((a,b)=>lens[a]-lens[b]||a-b);
  const map=new Map();
  let code=0n,prevLen=0;
  for(const sym of syms){
    const len=lens[sym];
    code <<= BigInt(len-prevLen);
    map.set(len+":"+code.toString(),sym);
    code++;prevLen=len;
  }
  const out=[];let cur=0n,nb=0;
  for(;p<data.length&&out.length<orig;p++){
    const byte=data[p];
    for(let k=7;k>=0&&out.length<orig;k--){
      cur=(cur<<1n)|BigInt((byte>>k)&1);nb++;
      const sym=map.get(nb+":"+cur.toString());
      if(sym!==undefined){out.push(sym);cur=0n;nb=0}
    }
  }
  if(out.length!==orig)throw Error("Huffman decode failed");
  return Uint8Array.from(out);
}
function candidate(data,type){
  const raw=u8(data);
  const compact=compactSource(data,type);
  const compactBytes=u8(compact);
  const tok=webTokenEncode(data,type);
  const lz=lz2Compress(tok);
  const hf=huffCompress(lz);
  let best=raw,mode=0,decodedSize=raw.length;
  if(compactBytes.length<best.length){best=compactBytes;mode=1;decodedSize=compactBytes.length}
  // The token/LZ representations decode to the compacted source.
  if(tok.length<best.length){best=tok;mode=1;decodedSize=compactBytes.length}
  if(lz.length<best.length){best=lz;mode=2;decodedSize=compactBytes.length}
  if(hf && hf.length<best.length){best=hf;mode=3;decodedSize=compactBytes.length}
  return {mode,originalSize:decodedSize,data:best};
}
function decodeSectionV2(mode,data,originalSize,type){
  let a;
  if(mode===0)a=data;
  else if(mode===1)a=webTokenDecode(data);
  else if(mode===2)a=webTokenDecode(lz2Decompress(data));
  else if(mode===3)a=webTokenDecode(lz2Decompress(huffDecompress(data)));
  else throw Error("bad section mode");
  if(a.length!==originalSize)throw Error("section size mismatch");
  // The encoder's whitespace compaction changes the text representation; for UHTML
  // rendering this is intentional. The raw fallback guarantees exact preservation when compression is not smaller.
  return text(a);
}
function makeBinary(html,css,js){
  const secs=[candidate(html,"html"),candidate(css,"css"),candidate(js,"js")];
  const a=[...MAGIC,3];
  for(const s of secs)a.push(s.mode,...varint(s.originalSize),...varint(s.data.length),...s.data);
  return Uint8Array.from(a)
}


function oldTokenDecode(a){
  const out=[];let p={i:0};
  while(p.i<a.length){
    const type=a[p.i++];
    if(type===0){const n=readVar(a,p);for(let i=0;i<n;i++)out.push(a[p.i++]);}
    else if(type===1){const id=readVar(a,p);if(id>=TOKENS.length)throw Error("bad token");out.push(...u8(TOKENS[id]));}
    else throw Error("bad legacy token stream");
  }
  return Uint8Array.from(out);
}
function oldLzDecompress(a){
  const out=[];let p=0;
  while(p<a.length){
    const op=a[p++];
    if(op===0)out.push(a[p++]);
    else if(op===1){const len=a[p++],reps=a[p++],pat=a.slice(p,p+len);p+=len;for(let r=0;r<reps;r++)out.push(...pat);}
    else if(op===2){let q={i:p};const dist=readVar(a,q);p=q.i;const len=a[p++];if(dist<=0||dist>out.length)throw Error("bad distance");for(let k=0;k<len;k++)out.push(out[out.length-dist]);}
    else throw Error("bad legacy LZ opcode");
  }
  return Uint8Array.from(out);
}

// Keep reading old shared URLs generated by UHTML-LZ v1.
function parseBinaryV1(a){
  for(let i=0;i<OLD_MAGIC.length;i++)if(a[i]!==OLD_MAGIC[i])throw Error("not UHTML v1");
  let p={i:OLD_MAGIC.length};if(a[p.i++]!==3)throw Error("unsupported section count");
  const vals=[];
  for(let n=0;n<3;n++){
    const mode=a[p.i++],os=readVar(a,p),cs=readVar(a,p),d=a.slice(p.i,p.i+cs);p.i+=cs;
    let x=mode===0?d:mode===1?oldTokenDecode(d):oldTokenDecode(oldLzDecompress(d));
    vals.push(text(x));
  }
  return {html:vals[0],css:vals[1],js:vals[2]};
}
function parseBinary(a){
  if(a.length<7)throw Error("invalid UHTML");
  const is2=MAGIC.every((v,i)=>a[i]===v);
  if(!is2 && OLD_MAGIC.every((v,i)=>a[i]===v))return parseBinaryV1(a);
  if(!is2)throw Error("not UHTML");
  let p={i:MAGIC.length};if(a[p.i++]!==3)throw Error("unsupported section count");
  const vals=[];
  const types=["html","css","js"];
  for(let n=0;n<3;n++){
    const mode=a[p.i++],os=readVar(a,p),cs=readVar(a,p),d=a.slice(p.i,p.i+cs);p.i+=cs;
    vals.push(decodeSectionV2(mode,d,os,types[n]));
  }
  return {html:vals[0],css:vals[1],js:vals[2]};
}
function b64enc(a){let s="",i=0;for(;i+2<a.length;i+=3){const n=(a[i]<<16)|(a[i+1]<<8)|a[i+2];s+=B64[n>>18&63]+B64[n>>12&63]+B64[n>>6&63]+B64[n&63]}if(i<a.length){let n=a[i]<<16;if(i+1<a.length)n|=a[i+1]<<8;s+=B64[n>>18&63]+B64[n>>12&63];if(i+1<a.length)s+=B64[n>>6&63]}return s}
function b64dec(s){const map=new Map([...B64].map((c,i)=>[c,i]));let acc=0,bits=0,out=[];for(const c of s){const v=map.get(c);if(v===undefined)throw Error("bad base64url");acc=(acc<<6)|v;bits+=6;if(bits>=8){bits-=8;out.push(acc>>bits&255)}}return Uint8Array.from(out)}

/* ---------------- Multi-file editor ---------------- */

const files = new Map([
  ["index.html",{type:"html",content:"<div class=\"box\"><h1>Hello UHTML</h1><p id=\"msg\">Edit me.</p><button onclick=\"hello()\">Click</button></div>"}],
  ["style.css",{type:"css",content:"body{font-family:Arial;background:#eef}.box{max-width:520px;margin:80px auto;padding:30px;background:white;border:1px solid #bbb;text-align:center}button{padding:8px 16px}"}],
  ["app.js",{type:"js",content:"function hello(){document.getElementById('msg').textContent='UHTML works!';}"}]
]);
let current="index.html";
let nextId=1;

const $=id=>document.getElementById(id);

function icon(type){return type==="html"?"H":type==="css"?"C":"J"}

function renderFiles(){
  const el=$("files");el.innerHTML="";
  [...files.entries()].forEach(([name,f])=>{
    const row=document.createElement("div");row.className="file"+(name===current?" active":"");
    row.innerHTML='<span class="file-icon">'+icon(f.type)+'</span><span class="file-name"></span>';
    row.querySelector(".file-name").textContent=name;
    row.onclick=()=>selectFile(name);
    el.appendChild(row)
  })
}
function renderTabs(){
  const el=$("tabs");el.innerHTML="";
  [...files.entries()].forEach(([name,f])=>{
    const tab=document.createElement("div");tab.className="tab"+(name===current?" active":"");
    tab.textContent=name;
    if(name!=="index.html"){
      const x=document.createElement("span");x.className="x";x.textContent="×";
      x.onclick=e=>{e.stopPropagation();files.delete(name);if(current===name)current="index.html";saveEditor();renderAll()}
      tab.appendChild(x)
    }
    tab.onclick=()=>selectFile(name);el.appendChild(tab)
  })
}
function loadEditor(){ $("editor").value=files.get(current).content }
function saveEditor(){if(files.has(current))files.get(current).content=$("editor").value}
function selectFile(name){
  saveEditor();current=name;renderAll()
}
function renderAll(){renderFiles();renderTabs();loadEditor();$("status").textContent="UHTML-LZ · "+current}
function addFile(type){
  if(currentMode==="no") return;
  if(type!=="html" && type!=="css" && type!=="js") return;
  const base=type==="html"?"page":type==="css"?"style":"script";
  let name=base+"."+type, n=2;
  while(files.has(name)) name=base+"-"+(n++)+"."+type;
  const content=type==="html"?"<div></div>\n":type==="css"?"body {\n}\n":"function main() {\n}\n";
  files.set(name,{type,content}); current=name;
  $("addModal").style.display="none"; renderAll(); 
  setStatus("UHTML-LZ · "+name+" added"); $("editor").focus();
}
$("editor").addEventListener("input",()=>{
  if(currentMode==="no") return;
  saveEditor();
  $("status").textContent="UHTML-LZ · "+current+" · modified";
  updateStats();
})

function getBundle(){
  saveEditor();
  let html="",css="",js="";
  for(const [name,f] of files){
    if(f.type==="html")html+=f.content+"\n";
    else if(f.type==="css")css+=f.content+"\n";
    else if(f.type==="js")js+=f.content+"\n";
  }
  return{html,css,js}
}

function makeURL(mode="wa"){
  const b=getBundle(),bin=makeBinary(b.html,b.css,b.js);
  const base=location.href.split("#")[0].split("?")[0];
  return base+"?wt="+(mode==="no"?"no":"wa")+"#/u/"+b64enc(bin);
}
function openPayload(payload){
  const b=parseBinary(b64dec(payload));
  files.clear();
  files.set("index.html",{type:"html",content:b.html});
  files.set("style.css",{type:"css",content:b.css});
  files.set("app.js",{type:"js",content:b.js});
  current="index.html";renderAll();
}
function loadFromHash(){
  if(!location.hash.startsWith("#/u/")){renderAll();applyMode();return}
  try{
    openPayload(location.hash.slice(4));
    applyMode();
    setStatus("UHTML-LZ · decoded · "+(currentMode==="no"?"read-only":"editable"));
  }catch(e){setStatus("UHTML error: "+e.message)}
}

let currentMode = "wa";

function getMode(){
  return new URLSearchParams(location.search).get("wt") === "no" ? "no" : "wa";
}

function applyMode(){
  currentMode = getMode();
  const locked = currentMode === "no";
  $("editor").readOnly = locked;
  $("editor").classList.toggle("readonly", locked);
  $("addFileBtn").disabled = locked;
  $("addFileBtn").style.opacity = locked ? ".5" : "1";
  setStatus("UHTML-LZ · " + (locked ? "read-only" : "editable"));
}

/* ---------------- UI ---------------- */

$("addFileBtn").onclick=()=>{
  if(currentMode!=="no") $("addModal").style.display="flex";
};
$("closeAdd").onclick=()=>$("addModal").style.display="none";
document.querySelectorAll("#addModal [data-type]").forEach(b=>b.onclick=()=>addFile(b.dataset.type));

$("shareBtn").onclick=()=>{
  try{
    const mode=confirm("수정 가능한 URL로 공유할까요?\n\n확인 = wt=wa (수정 가능)\n취소 = wt=no (읽기 전용)") ? "wa" : "no";
    const url=makeURL(mode);
    $("shareUrl").value=url;
    $("shareModal").style.display="flex";
    history.replaceState(null,"",url);
    applyMode();
  }catch(e){setStatus("Share error: "+e.message)}
};
$("closeShare").onclick=()=>$("shareModal").style.display="none";
$("copyShare").onclick=async()=>{
  try{
    await navigator.clipboard.writeText($("shareUrl").value);
    $("status").textContent="UHTML-LZ · URL copied"
  }catch(e){$("status").textContent="Copy failed"}
};

/* ---------------- Upgrade layer ---------------- */

let dirty = false;
const fileContext = document.createElement("div");
fileContext.style.cssText = "position:fixed;display:none;background:#fff;border:1px solid #999;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:20;padding:4px;min-width:150px";
fileContext.innerHTML = `
  <button data-act="rename" style="display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px;cursor:pointer">이름 변경</button>
  <button data-act="delete" style="display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px;cursor:pointer">삭제</button>
`;
document.body.appendChild(fileContext);

function setStatus(s){
  $("status").textContent=s;
  updateStats();
}
function updateStats(){
  try{
    const b=getBundle();
    const raw=new TextEncoder().encode(b.html).length+
             new TextEncoder().encode(b.css).length+
             new TextEncoder().encode(b.js).length;
    const u=makeBinary(b.html,b.css,b.js).length;
    const ratio=raw?((1-u/raw)*100):0;
    $("stats").textContent=`raw ${raw} B · UHTML ${u} B · ${ratio>=0?ratio.toFixed(1)+"% smaller":Math.abs(ratio).toFixed(1)+"% larger"}`;
  }catch(_){}
}
function markDirty(){
  dirty=true;
  const f=files.get(current);
  if(f) f.content=$("editor").value;
  updateStats();
}

$("editor").addEventListener("input",()=>{
  markDirty();
  
  setStatus("UHTML-LZ · "+current+" · modified");
});
$("editor").addEventListener("keydown",e=>{
  if(currentMode==="no"){e.preventDefault();return}
  if(e.key==="Tab"){
    e.preventDefault();
    const a=e.target,b=a.selectionStart;
    a.value=a.value.slice(0,b)+"  "+a.value.slice(a.selectionEnd);
    a.selectionStart=a.selectionEnd=b+2;
    markDirty();
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){
    e.preventDefault();saveEditor();dirty=false;setStatus("UHTML-LZ · saved");
  }
});

function validFileName(name){
  return /^[A-Za-z0-9._-]+\.(html?|css|js)$/i.test(name) &&
         !/[\\\\/]/.test(name) && name.length<=80;
}
function fileTypeFromName(name){
  const ext=name.toLowerCase().split(".").pop();
  if(ext==="html"||ext==="htm")return"html";
  if(ext==="css")return"css";
  if(ext==="js")return"js";
  return null;
}
function defaultContent(type){
  if(type==="html")return "<div></div>\n";
  if(type==="css")return "body {\n}\n";
  return "function main() {\n}\n";
}

function addNamedFile(name,type,content){
  if(!validFileName(name)) throw Error("지원하지 않는 파일 이름입니다.");
  if(files.has(name)) throw Error("같은 이름의 파일이 이미 있습니다.");
  if(!type) type=fileTypeFromName(name);
  files.set(name,{type,content:content??defaultContent(type)});
  current=name;
  dirty=true;
  renderAll();setStatus("UHTML-LZ · "+name+" added");
}


function renameFile(name){
  if(currentMode==="no") return;
  if(!files.has(name)||name==="index.html")return;
  const f=files.get(name);
  const nn=prompt("새 파일 이름",name);
  if(!nn||nn===name)return;
  if(!validFileName(nn)||files.has(nn)){alert("파일 이름이 올바르지 않거나 이미 존재합니다.");return}
  const nt=fileTypeFromName(nn);
  // Prevent accidentally changing the file language by rename.
  if(nt!==f.type){alert("파일 확장자를 같은 종류로 유지하세요.");return}
  files.delete(name);files.set(nn,{...f});if(current===name)current=nn;
  dirty=true;renderAll();setStatus("UHTML-LZ · renamed")
}

function removeFile(name){
  if(currentMode==="no") return;
  if(name==="index.html"){alert("index.html은 삭제할 수 없습니다.");return}
  if(!confirm(`"${name}"을 삭제할까요?`))return;
  files.delete(name);
  if(current===name)current=[...files.keys()][0]||"index.html";
  dirty=true;renderAll();setStatus("UHTML-LZ · deleted")
}

function showContext(e,name){
  e.preventDefault();
  fileContext.style.left=Math.min(e.clientX,innerWidth-170)+"px";
  fileContext.style.top=Math.min(e.clientY,innerHeight-100)+"px";
  fileContext.style.display="block";
  fileContext.dataset.name=name;
}
document.addEventListener("click",e=>{
  if(!fileContext.contains(e.target))fileContext.style.display="none";
});
fileContext.querySelector('[data-act="rename"]').onclick=()=>{
  renameFile(fileContext.dataset.name);fileContext.style.display="none"
};
fileContext.querySelector('[data-act="delete"]').onclick=()=>{
  removeFile(fileContext.dataset.name);fileContext.style.display="none"
};

function enhanceFileRows(){
  document.querySelectorAll(".file").forEach(row=>{
    const name=row.querySelector(".file-name").textContent;
    row.ondblclick=e=>{e.stopPropagation();renameFile(name)};
    row.oncontextmenu=e=>showContext(e,name);
    row.draggable=true;
    row.ondragstart=e=>{if(currentMode==="no"){e.preventDefault();return}e.dataTransfer.setData("text/uhtml-file",name)};
    row.ondragover=e=>e.preventDefault();
    row.ondrop=e=>{
      if(currentMode==="no") return;
      e.preventDefault();
      const from=e.dataTransfer.getData("text/uhtml-file");
      if(!from||from===name)return;
      const keys=[...files.keys()], a=keys.indexOf(from), b=keys.indexOf(name);
      if(a<0||b<0)return;
      keys.splice(a,1);keys.splice(b,0,from);
      const old=new Map(files);
      files.clear();keys.forEach(k=>files.set(k,old.get(k)));
      renderAll();setStatus("UHTML-LZ · file order changed");
    };
  });
}
const oldRenderAll=renderAll;
renderAll=function(){
  oldRenderAll();
  enhanceFileRows();
  updateStats();
};

function generateShareURL(){
  saveEditor();
  const u=makeURL();
  history.replaceState(null,"",u);
  return u;
}
$("shareBtn").onclick=()=>{
  try{
    const url=generateShareURL();
    $("shareUrl").value=url;
    $("shareModal").style.display="flex";
    setStatus("UHTML-LZ · share URL generated");
    dirty=false;
  }catch(e){setStatus("Share error: "+e.message)}
};

function importTextFiles(fileList){
  if(currentMode==="no") return;
  const arr=[...fileList];
  if(!arr.length)return;
  let added=0, skipped=0;
  for(const file of arr){
    const type=fileTypeFromName(file.name);
    if(!type){skipped++;continue}
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        let name=file.name;
        if(files.has(name)){
          const p=name.lastIndexOf("."),base=name.slice(0,p),ext=name.slice(p);
          let n=2;while(files.has(`${base}-${n}${ext}`))n++;
          name=`${base}-${n}${ext}`;
        }
        files.set(name,{type,content:String(reader.result||"")});
        current=name;added++;dirty=true;renderAll();
        setStatus(`UHTML-LZ · imported ${added}${skipped?` · skipped ${skipped}`:""}`);
      }catch(e){setStatus("Import error: "+e.message)}
    };
    reader.readAsText(file);
  }
}

const dropZone=document.body;
dropZone.addEventListener("dragover",e=>{
  if(e.dataTransfer?.files?.length)e.preventDefault();
});
dropZone.addEventListener("drop",e=>{
  if(!e.dataTransfer?.files?.length)return;
  e.preventDefault();importTextFiles(e.dataTransfer.files);
});

$("addFileBtn").title="새 HTML/CSS/JS 파일 추가";
$("shareBtn").title="현재 프로젝트를 하나의 UHTML URL로 공유";

window.addEventListener("hashchange",loadFromHash);

renderAll();

updateStats();
</script>
</body>
</html>
